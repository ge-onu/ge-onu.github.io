<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <!-- 카드 커버. 밀플래닝·RAG 커버와 같은 1536x1024(3:2)이고, 캐릭터를
       왼쪽이 아니라 **오른쪽**에 둔다 — 왼쪽은 라벨·칩·큰 문구가 얹히는
       자리다. 두 커버 모두 그 배치다.

       글자는 폰트가 아니라 획으로 그렸다. 배경 이미지로 쓰이는 SVG는
       외부 폰트를 불러오지 못해서, 폰트 이름을 적어 두면 보는 환경마다
       다른 글씨가 나온다. stroke-linecap:round 로 동글동글한 결을 낸다. -->
  <style>
    .bd{fill:#7c8cf2}
    .sh{fill:#cfd5dc; opacity:.5}
    .ey{fill:#ffffff}
    .mo{stroke:#ffffff; stroke-width:1.35; stroke-linecap:round; fill:none}
    .hl{fill:#ffffff; opacity:.32}
    .wm{fill:none; stroke:#7c8cf2; stroke-width:26;
        stroke-linecap:round; stroke-linejoin:round}
    .wd{fill:#7c8cf2}
  </style>

  <!-- 돌멩이 -->
  <g transform="translate(940 230) scale(14)">
    <ellipse cx="15" cy="24.6" rx="9.6" ry="1.5" class="sh"/>
    <path class="bd" d="M15.4 5.4c4.9-.5 9.3 3.1 9.9 8.1.6 5-2.4 8.9-7.3 9.5l-5.6.6C7.5 24.2 4.6 21.4 4.2 17c-.5-5.2 2.6-10 7.2-11z"/>
    <circle class="ey" cx="11.8" cy="14.9" r="1.45"/>
    <circle class="ey" cx="18.4" cy="14.4" r="1.45"/>
    <path class="mo" d="M13.2 18.2c1 .9 2.6.8 3.5-.3"/>
    <circle class="hl" cx="9.4" cy="10.4" r="1.5"/>
  </g>

  <!-- didim -->
  <g transform="translate(1150 818) scale(0.74) translate(-264 0)">
    <circle class="wm" cx="50" cy="-50" r="50"/>
    <path   class="wm" d="M100,-160 V0"/>
    <path   class="wm" d="M150,-100 V0"/>
    <circle class="wd" cx="150" cy="-148" r="13"/>
    <circle class="wm" cx="250" cy="-50" r="50"/>
    <path   class="wm" d="M300,-160 V0"/>
    <path   class="wm" d="M350,-100 V0"/>
    <circle class="wd" cx="350" cy="-148" r="13"/>
    <path   class="wm" d="M400,0 V-68 A32,32 0 0 1 464,-68 V0"/>
    <path   class="wm" d="M464,-68 A32,32 0 0 1 528,-68 V0"/>
  </g>
</svg>
