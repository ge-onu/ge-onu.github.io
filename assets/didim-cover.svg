<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <!-- 카드 커버. 밀플래닝·RAG 커버와 같은 1536x1024(3:2)이고, 캐릭터를
       왼쪽이 아니라 **오른쪽**에 둔다 — 왼쪽은 라벨·칩·큰 문구가 얹히는
       자리다. 두 커버 모두 그 배치다.

       글자는 폰트가 아니라 획으로 그렸다. 배경 이미지로 쓰이는 SVG는
       외부 폰트를 불러오지 못해서, 폰트 이름을 적어 두면 보는 환경마다
       다른 글씨가 나온다. stroke-linecap:round 로 동글동글한 결을 낸다. -->
  <style>
    .bd{fill:#7c8cf2}
    .sh{fill:#cfd5dc; opacity:.5}
    .ey{fill:#ffffff}
    .mo{stroke:#ffffff; stroke-width:1.35; stroke-linecap:round; fill:none}
    .hl{fill:#ffffff; opacity:.32}
    .wm{fill:none; stroke:#7c8cf2; stroke-width:42;
        stroke-linecap:round; stroke-linejoin:round}
    .wd{fill:#7c8cf2}
  </style>

  <!-- 돌멩이 -->
  <g transform="translate(899 178) scale(17)">
    <ellipse cx="15" cy="24.6" rx="9.6" ry="1.5" class="sh"/>
    <path class="bd" d="M15.4 5.4c4.9-.5 9.3 3.1 9.9 8.1.6 5-2.4 8.9-7.3 9.5l-5.6.6C7.5 24.2 4.6 21.4 4.2 17c-.5-5.2 2.6-10 7.2-11z"/>
    <circle class="ey" cx="11.8" cy="14.9" r="1.45"/>
    <circle class="ey" cx="18.4" cy="14.4" r="1.45"/>
    <path class="mo" d="M13.2 18.2c1 .9 2.6.8 3.5-.3"/>
    <circle class="hl" cx="9.4" cy="10.4" r="1.5"/>
  </g>

  <!-- didim — 두툼하고 통통한 결. 획을 x높이의 38%까지 올리고 글자마다
       위아래로 살짝 튀게 했다. i 의 점은 획과 26 만큼 띄운다 — 붙으면
       두께 때문에 하나의 덩어리로 뭉쳐 보인다. -->
  <g transform="translate(1150 793) scale(0.612) translate(-322 0)">
    <g transform="translate(0 0)">
      <circle class="wm" cx="55" cy="-55" r="55"/>
      <path   class="wm" d="M110,-190 V0"/>
    </g>
    <g transform="translate(0 -7)">
      <path   class="wm" d="M178,-110 V0"/>
      <circle class="wd" cx="178" cy="-178" r="20"/>
    </g>
    <g transform="translate(0 6)">
      <circle class="wm" cx="302" cy="-55" r="55"/>
      <path   class="wm" d="M357,-190 V0"/>
    </g>
    <g transform="translate(0 -5)">
      <path   class="wm" d="M425,-110 V0"/>
      <circle class="wd" cx="425" cy="-178" r="20"/>
    </g>
    <g transform="translate(0 3)">
      <path   class="wm" d="M492,0 V-72 A38,38 0 0 1 568,-72 V0"/>
      <path   class="wm" d="M568,-72 A38,38 0 0 1 644,-72 V0"/>
    </g>
  </g>
</svg>
