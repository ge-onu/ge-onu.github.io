<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="k8sCoverTitle k8sCoverDesc">
  <title id="k8sCoverTitle">Kubernetes 실습 커버</title>
  <desc id="k8sCoverDesc">kubeadm 멀티노드 클러스터 실습을 나타내는 커버 이미지</desc>

  <rect width="1200" height="675" fill="#f5f8fe"/>

  <!-- 중앙 마크: 노드 3개가 컨트롤 플레인에 연결된 멀티노드 구성 -->
  <g transform="translate(600 318)">
    <g stroke="#2B60CE" stroke-width="7" stroke-linecap="round" opacity=".45">
      <path d="M0 0 -168 104"/>
      <path d="M0 0 168 104"/>
      <path d="M0 0 0 150"/>
    </g>

    <circle cx="0" cy="0" r="86" fill="#2B60CE"/>
    <g stroke="#ffffff" stroke-width="9" stroke-linecap="round">
      <path d="M0 -58v116"/>
      <path d="M-58 0h116"/>
      <path d="M-41 -41 41 41"/>
      <path d="M41 -41 -41 41"/>
    </g>

    <g fill="#ffffff" stroke="#2B60CE" stroke-width="6">
      <circle cx="-168" cy="104" r="40"/>
      <circle cx="168" cy="104" r="40"/>
      <circle cx="0" cy="150" r="40"/>
    </g>
  </g>

  <text x="600" y="560" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"
        font-size="40" font-weight="700" fill="#1f2328">Kubernetes 멀티노드 실습</text>
  <text x="600" y="608" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif"
        font-size="27" fill="#6b7480">kubeadm · Network · Storage · RBAC · Scaling</text>
</svg>
