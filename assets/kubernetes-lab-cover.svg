<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes Multi-node Lab diagram</title>
  <desc id="desc">Control plane, worker nodes, ingress, service and pods connected in a simple cluster diagram.</desc>
  <rect width="1200" height="640" fill="#f6f8fb"/>
  <g fill="none" stroke="#9fb0c2" stroke-width="3">
    <path d="M240 320H430"/>
    <path d="M770 320H960"/>
    <path d="M600 190V255"/>
    <path d="M600 385V455"/>
  </g>
  <g font-family="Inter, Pretendard, Arial, sans-serif">
    <rect x="70" y="250" width="170" height="140" rx="18" fill="#ffffff" stroke="#90a4b8" stroke-width="4"/>
    <text x="155" y="308" text-anchor="middle" font-size="22" font-weight="700" fill="#24364b">Client</text>
    <text x="155" y="344" text-anchor="middle" font-size="17" fill="#6c7b8b">External traffic</text>

    <rect x="430" y="255" width="340" height="130" rx="22" fill="#ffffff" stroke="#326ce5" stroke-width="4"/>
    <circle cx="495" cy="320" r="32" fill="#326ce5"/>
    <path d="M495 292v56M467 320h56M475 300l40 40M515 300l-40 40" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="625" y="312" font-size="26" font-weight="750" fill="#24364b">Kubernetes Cluster</text>
    <text x="625" y="347" font-size="18" fill="#6c7b8b">kubeadm · Calico · CoreDNS</text>

    <rect x="960" y="250" width="170" height="140" rx="18" fill="#ffffff" stroke="#90a4b8" stroke-width="4"/>
    <text x="1045" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#24364b">Ingress</text>
    <text x="1045" y="336" text-anchor="middle" font-size="17" fill="#6c7b8b">Service → Pod</text>
    <text x="1045" y="363" text-anchor="middle" font-size="15" fill="#8a98a8">MetalLB / NGINX</text>

    <rect x="505" y="65" width="190" height="125" rx="18" fill="#ffffff" stroke="#90a4b8" stroke-width="4"/>
    <text x="600" y="119" text-anchor="middle" font-size="21" font-weight="700" fill="#24364b">Control Plane</text>
    <text x="600" y="151" text-anchor="middle" font-size="16" fill="#6c7b8b">API · Scheduler</text>

    <rect x="360" y="455" width="210" height="120" rx="18" fill="#ffffff" stroke="#90a4b8" stroke-width="4"/>
    <rect x="630" y="455" width="210" height="120" rx="18" fill="#ffffff" stroke="#90a4b8" stroke-width="4"/>
    <text x="465" y="506" text-anchor="middle" font-size="21" font-weight="700" fill="#24364b">Worker 01</text>
    <text x="465" y="538" text-anchor="middle" font-size="16" fill="#6c7b8b">Pods · PV/PVC</text>
    <text x="735" y="506" text-anchor="middle" font-size="21" font-weight="700" fill="#24364b">Worker 02</text>
    <text x="735" y="538" text-anchor="middle" font-size="16" fill="#6c7b8b">Pods · HPA/KEDA</text>
    <path d="M600 455H465M600 455H735" fill="none" stroke="#9fb0c2" stroke-width="3"/>
  </g>
</svg>
