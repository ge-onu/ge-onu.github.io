# 연락하기 → Slack 전달. 배포: 이 폴더에서 `npx wrangler deploy`, 웹후크: `npx wrangler secret put SLACK_WEBHOOK_URL`
name = "geonu-contact"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
# 버전별 미리보기 주소는 쓰지 않는다(공개 주소 하나만 둔다).
preview_urls = false

[[ratelimits]]
name = "RL_IP"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_ALL"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
