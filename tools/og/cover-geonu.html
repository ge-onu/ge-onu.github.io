<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="color-scheme" content="light only">
<!-- 홈 "그 밖의 기록"의 거누 카드 표지(1536×1024). node로 찍어 assets/covers/geonu.webp 로 저장한다. -->
<style>
@font-face{font-family:PS;src:url(/assets/fonts/portfolio-sans-subset.woff2) format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}:root{color-scheme:light only}
body{width:1536px;height:1024px;font-family:PS,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.c{position:relative;width:1536px;height:1024px;overflow:hidden;background:radial-gradient(820px 640px at 70% 52%,#e9ebff 0,#f6f7fb 70%)}
.m{position:absolute;left:640px;top:170px;width:720px;height:720px;filter:drop-shadow(0 40px 50px rgba(40,44,90,.22))}
.sh{position:absolute;left:720px;top:880px;width:560px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,24,60,.18),transparent)}
.b{position:absolute;background:#fff;border:4px solid #e3e4ee;border-radius:40px;box-shadow:0 18px 40px -20px rgba(30,32,80,.35);padding:30px 38px;font-size:40px;font-weight:700;color:#1d1e26;letter-spacing:-.02em}
.b1{left:150px;top:230px;border-bottom-right-radius:10px}
.b2{left:250px;top:430px;font-size:34px;font-weight:600;color:#4b4fd6;background:#f1f2ff;border-color:#d9dbff;border-bottom-right-radius:10px}
.chips{position:absolute;left:150px;top:620px;display:flex;flex-direction:column;gap:18px}
.chip{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid #e3e4ee;border-radius:22px;padding:18px 26px;font-size:30px;font-weight:600;color:#3a3b46;box-shadow:0 10px 26px -18px rgba(30,32,80,.4)}
.chip i{width:18px;height:18px;border-radius:50%;background:#4b4fd6;flex:none}
</style></head><body><div class="c">
<div class="b b1">서버리스는 어디까지 했어요?</div>
<div class="b b2">근거 안에서만 답해요</div>
<div class="chips"><div class="chip"><i></i>근거 · 서버리스 전환</div><div class="chip"><i></i>근거 · 판정 5축</div></div>
<div class="sh"></div><img class="m" src="/assets/chat-mascot.png" alt="">
</div></body></html>
