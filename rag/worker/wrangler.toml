# 거누 응답 서버. 배포: rag/worker 에서 `npx wrangler deploy`, 키: `npx wrangler secret put GEMINI_API_KEY`
name = "geonu-rag"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# 작성 모델: 첫 모델이 실패하거나 깨진 글이면 두 번째 모델로 한 번만 다시 부르고, 그래도 안 되면 간단 모드(근거 문장)로 답한다.
[vars]
GEMINI_MODELS = "gemini-3.1-flash-lite,gemini-3.8-flash"

# IP별 분당 10회. Workers Rate Limiting 바인딩(없으면 worker.js의 인스턴스별 제한을 쓴다).
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
