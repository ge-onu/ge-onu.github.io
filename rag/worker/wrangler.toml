# 거누 응답 서버. 배포: rag/worker 에서 `npx wrangler deploy`, 키: `npx wrangler secret put GEMINI_API_KEY`
name = "geonu-rag"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
# 버전별 미리보기 주소는 쓰지 않는다(공개 주소 하나만 둔다).
preview_urls = false

# 작성 모델: 앞에서부터 차례로 시도(무료 등급 503 대비, 시간 예산 18초 안). 다 실패하면 간단 모드(근거 문장)로 답한다.
[vars]
GEMINI_MODELS = "gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-flash-lite-latest"

# IP별 분당 10회. Workers Rate Limiting 바인딩(없으면 worker.js의 인스턴스별 제한을 쓴다).
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
