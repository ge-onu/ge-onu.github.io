name: Apply provided portfolio assets

on:
  push:
    branches:
      - feat/public-copy-style-sweep
    paths:
      - .github/workflows/apply-provided-assets.yml

permissions:
  contents: write

jobs:
  apply-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-copy-style-sweep
          fetch-depth: 0

      - name: Replace header home icon with provided asset
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = {
              Path('index.html'): 'assets/images/home-icon.svg',
              Path('projects/mealplanning/index.html'): '../../assets/images/home-icon.svg',
              Path('projects/kubernetes-lab/index.html'): '../../assets/images/home-icon.svg',
          }

          pattern = re.compile(r'<svg class="identity-home"[^>]*>.*?</svg>', re.S)
          replacement_count = 0
          for path, src in targets.items():
              text = path.read_text(encoding='utf-8')
              replacement = f'<img class="identity-home-img" src="{src}" alt="" aria-hidden="true">'
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one identity-home SVG, got {count}')
              path.write_text(text, encoding='utf-8')
              replacement_count += count
          print(f'replaced {replacement_count} home icons')

      - name: Refresh asset README
        shell: bash
        run: |
          cat > assets/images/README.md <<'EOF'
          # 이미지 자산

          ## home-icon.svg

          사용자가 제공한 흑백 홈 아이콘을 벡터 트레이싱해 저장한 자산입니다.
          상단의 홈 이동 버튼에서 사용하며 원본 비율을 유지합니다.

          적용 위치:
          - `index.html`
          - `projects/mealplanning/index.html`
          - `projects/kubernetes-lab/index.html`

          ## kubernetes-logo.svg

          사용자가 제공한 Kubernetes 로고/워드마크 이미지를 벡터 트레이싱해 저장한 자산입니다.
          `assets/kubernetes-lab-cover.svg`에도 같은 벡터 자산을 사용해 홈 카드와 Kubernetes 상세 Hero에 반영합니다.

          손상된 base64-in-SVG 방식은 더 이상 사용하지 않습니다.
          EOF

      - name: Run evidence and link checks
        shell: bash
        run: |
          python tools/scan-evidence.py
          python tools/check-links.py

      - name: Commit asset wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projects/mealplanning/index.html projects/kubernetes-lab/index.html assets/images/README.md
          git commit -m 'Wire user-provided portfolio image assets'
          git push origin HEAD:feat/public-copy-style-sweep
